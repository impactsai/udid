name: Validate facilitator reference

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/facilitator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/facilitator/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run openapi && git diff --exit-code -- openapi.json
